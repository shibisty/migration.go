name: CI

# Dependencies are installed with gtr from gtr.json (ADR-0001); gtr-manager is built
# from source until it is released.
# This file must be moved to .github/workflows/ci.yml.

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unit (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    env: # dependencies come from gtr_modules, never from the network (ADR-0001)
      GOPROXY: "off"
      GOWORK: "off"
      GOFLAGS: -mod=mod
      GTR_GOPROXY: https://proxy.golang.org
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.22", "stable"] # minimum (ADR-0007) and latest
        exclude:
          # Go 1.22 links binaries without LC_UUID, and dyld on current macOS runners refuses
          # them ("missing LC_UUID load command"); Go 1.24+ adds it. macOS runs on stable.
          - os: macos-latest
            go: "1.22"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5 # gtr-manager itself needs the latest Go
        with:
          go-version: stable
          cache: false
      - name: gtr
        shell: bash
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOFLAGS: ""
        run: |
          git clone --depth 1 https://github.com/shibisty/gtr-manager "$RUNNER_TEMP/gtr-manager"
          (cd "$RUNNER_TEMP/gtr-manager" && go build -o "$RUNNER_TEMP/gtr-bin/gtr$(go env GOEXE)" ./cmd/gtr-manager)
          echo "$RUNNER_TEMP/gtr-bin" >> "$GITHUB_PATH"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: gtr install
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gtr install # switch to `gtr ci` once gtr.lock is committed
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        shell: bash # PowerShell on Windows splits -coverprofile=coverage.out
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: coverage >= 95%
        shell: bash
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t >= 95) ? 0 : 1 }'
